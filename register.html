<!DOCTYPE html>
<html lang="pt-br">

<head>

  <link href="assets/img/gs.jpg" rel="icon">
  <meta charset="utf-8">
  <link href="assets/vendors/css/all.min.css" rel="stylesheet" type="text/css">
  <link href="assets/vendors/css/bootstrap.min.css" rel="stylesheet" type="text/css">
  <link href="assets/vendors/css/ruang-admin.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">

</head>

<body class="bg-gradient-login">
  <!-- Register Content -->
  <div class="container-login">
    <div class="row justify-content-center">
      <div class="col-xl-6 col-lg-12 col-md-9">
        <div class="card shadow-sm my-5">
          <div class="card-body p-0">
            <div class="row">
              <div class="col-lg-12">
                <div class="login-form">
                  <div class="text-center">
                    <h1 class="h4 text-gray-900 mb-4">Cadastrar</h1>
                  </div>
                  <form>
                    <div class="form-group">
                      <label>Primeiro Nome</label>
                      <input type="text" class="form-control" id="exampleInputFirstName" placeholder="Coloque seu primeiro nome">
                    </div>
                    <div class="form-group">
                      <label>Segundo Nome</label>
                      <input type="text" class="form-control" id="exampleInputLastName" placeholder="Coloque seu segundo nome">
                    </div>
                    <div class="form-group">
                      <label>Email</label>
                      <input type="email" class="form-control" id="exampleInputEmail" aria-describedby="emailHelp"
                        placeholder="Insira seu email">
                    </div>
                    <div class="form-group">
                      <label>Crie sua Senha</label>
                      <input type="password" class="form-control" id="exampleInputPassword" placeholder="Insira uma senha">
                    </div>
                    <div class="form-group">
                      <label>Repita sua Senha</label>
                      <input type="password" class="form-control" id="exampleInputPasswordRepeat"
                        placeholder="Insira a mesma senha">
                    </div>
                    <div class="form-group">
                      <button type="submit" class="btn btn-primary btn-block">Cadastrar</button>
                    </div>
                    <hr>
                    <a href="index.html" class="btn btn-google btn-block">
                      <i class="fa fa-google" aria-hidden="true"></i> Entrar com o Google
                    </a>
                  </form>
                  <hr>
                  <div class="text-center">
                    <a class="font-weight-bold small" href="login.html"><h5>Já tem uma conta?</h5></a>
                  </div>
                  <div class="text-center">
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- Register Content -->
  <script src="assets/vendors/js/jquery.min.js"></script>
  <script src="assets/vendors/js/bootstrap.bundle.min.js"></script>
  <script src="assets/vendors/js/jquery.easing.min.js"></script>
  <script src="assets/vendors/js/ruang-admin.min.js"></script>
</body>

</html>
